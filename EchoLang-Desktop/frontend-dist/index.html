<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EchoLang</title>
    <style>
      :root { color-scheme: light; font-family: "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fa; color: #172033; }
      main { display: grid; justify-items: center; gap: 12px; }
      .mark { width: 72px; height: 72px; display: grid; place-items: center; border-radius: 22px; background: linear-gradient(145deg, #2d7cf6, #1b56d6); color: #fff; font-size: 31px; font-weight: 800; box-shadow: 0 16px 32px rgba(45, 109, 246, .22); }
      p { margin: 0; color: #68748a; font-size: 14px; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">文</div>
      <p>正在启动 EchoLang…</p>
    </main>
  </body>
</html>
